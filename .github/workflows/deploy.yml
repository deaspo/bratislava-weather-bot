name: Build & Deploy to Caprover

on:
  push:
    branches: [ devel ]
  pull_request:
    branches: [ devel ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Lint Python code
      run: |
        python -m py_compile main.py
        python -m py_compile weather_service.py
        python -m py_compile twitter_service.py
        python -m py_compile message_formatter.py
        python -m py_compile config.py
        python -m py_compile logger.py
        
    - name: Validate configuration
      run: |
        python -c "import config; print('✅ Configuration validation passed')"

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devel' && github.event_name == 'push'

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - uses: a7ul/tar-action@v1.1.0
      with:
        command: c
        cwd: "./"
        files: ./
        outPath: deploy.tar

    - name: Deploy App to CapRover
      uses: caprover/deploy-from-github@v1.0.1
      with:
        server: '${{ secrets.WEATHER_CAPROVER_SERVER }}'
        app: '${{ secrets.WEATHER_APP_NAME }}'
        token: '${{ secrets.WEATHER_APP_TOKEN }}'
        
    - name: Deployment Success Notification
      if: success()
      run: |
        echo "🎉 Deployment successful!"
        echo "Bot deployed to: ${{ secrets.WEATHER_CAPROVER_SERVER }}"
        echo "App: ${{ secrets.WEATHER_APP_NAME }}"
        
    - name: Deployment Failure Notification
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
