name: Build & Deploy to Caprover

on:
  push:
    branches: [ devel ]
  pull_request:
    branches: [ devel ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Lint Python code
      run: |
        python -m py_compile main.py
        python -m py_compile weather_service.py
        python -m py_compile twitter_service.py
        python -m py_compile message_formatter.py
        python -m py_compile config.py
        python -m py_compile logger.py
        
    - name: Validate configuration
      run: |
        python -c "import config; print('✅ Configuration validation passed')"

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devel' && github.event_name == 'push'

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Preset Image Name
      run: echo "IMAGE_URL=$(echo ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:$(echo ${{ github.sha }} | cut -c1-7) | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Build and push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ env.IMAGE_URL }}
        platforms: linux/amd64

    - name: Deploy Image to CapRover
      uses: caprover/deploy-from-github@v1.1.2
      with:
        server: '${{ secrets.WEATHER_CAPROVER_SERVER }}'
        app: '${{ secrets.WEATHER_APP_NAME }}'
        token: '${{ secrets.WEATHER_APP_TOKEN }}'
        image: ${{ env.IMAGE_URL }}
        
    - name: Deployment Success Notification
      if: success()
      run: |
        echo "🎉 Deployment successful!"
        echo "Bot deployed to: ${{ secrets.WEATHER_CAPROVER_SERVER }}"
        echo "App: ${{ secrets.WEATHER_APP_NAME }}"
        echo "Image: ${{ env.IMAGE_URL }}"
        
    - name: Deployment Failure Notification
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
